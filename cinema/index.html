<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b11" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23080b11%27/%3E%3Ctext x=%277%27 y=%2724%27 font-family=%27Arial%27 font-size=%2723%27 fill=%27white%27%3EB%3C/text%3E%3C/svg%3E"
    />
    <title>BAEV — First Light / Scene Lab</title>
    <meta
      name="description"
      content="Новая постановка конференции BAEV. Три камеры внутри одной сцены, подготовленной в Blender."
    />
    <script type="module" crossorigin src="/cinema/assets/index-CNIGrkgt.js"></script>
    <link rel="stylesheet" crossorigin href="/cinema/assets/index-DQSFmijd.css">
  </head>
  <body>
    <main>
      <picture class="poster"
        ><img
          src="/cinema/media/first-light-reference.jpg"
          alt="Конференционный зал BAEV: графитовая архитектура, мягкий свет и большая сцена."
      /></picture>
      <canvas id="viewport" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>
      <header>
        <a class="logo" href="/" aria-label="BAEV — главная"
          >BAEV<sup>®</sup></a
        ><span class="edition">SCENE STUDY / 001</span>
        <nav aria-label="Основная навигация">
          <a href="/work/">Проекты ↗</a><a href="/contact/">Контакт ↗</a>
        </nav>
      </header>
      <section class="caption" aria-labelledby="title">
        <p class="kicker">FIRST LIGHT</p>
        <h1 id="title">Перед первым<br />словом.</h1>
        <p class="description">Новая точка зрения на событие.</p>
      </section>
      <aside id="notice" role="status">Загружаем сцену…</aside>
      <div class="controls" hidden>
        <button
          id="play"
          type="button"
          aria-label="Запустить движение камеры"
          aria-pressed="false"
        >
          <span id="play-symbol" aria-hidden="true">▶</span
          ><span id="play-text">Пройти к сцене</span>
        </button>
        <nav class="shots" aria-label="Точки просмотра">
          <button data-shot="0" aria-current="step">
            01<span>Внутри события</span></button
          ><button data-shot="1">02<span>Первый свет</span></button
          ><button data-shot="2">03<span>Ближе к мысли</span></button>
        </nav>
        <div class="timeline">
          <label class="sr" for="timeline">Положение камеры</label
          ><input
            id="timeline"
            type="range"
            min="0"
            max="1"
            step="0.001"
            value="0"
            aria-valuetext="Начало эпизода"
          />
        </div>
        <div class="options">
          <button id="motion" type="button" aria-pressed="true">
            Движение: вкл.</button
          ><button id="static" type="button">Без 3D</button
          ><button id="editor-link" type="button" hidden>Настройка кадра</button
          ><span id="position" aria-live="off">01 / 03</span>
        </div>
      </div>
      <noscript
        ><style>#notice{display:none}</style>
        <p class="nojs">
          Показан статичный рендер. <a href="/work/">Открыть проекты →</a>
        </p></noscript
      >
    </main>
  </body>
</html>
